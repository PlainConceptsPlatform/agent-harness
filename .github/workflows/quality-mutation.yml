name: "Quality: Mutation testing (scheduled)"

# Mutation score (practice 3): whether the covered lines are actually asserted, measured weekly
# with StrykerJS over the modules in stryker.config.json `mutate`. Out of band, as the platform apps
# run it (Kitchen-Sink quality-mutation.yml): a full run takes far longer than the rest of CI, and
# the per-change gate is the coverage floor in ci.yml. The run fails below `thresholds.break`.
#
# It also runs on a pull request that changes the Stryker configuration or this workflow, so a
# change to the gate is measured before it lands.
on:
  schedule:
    - cron: "17 5 * * 6"
  workflow_dispatch:
  pull_request:
    paths:
      - stryker.config.json
      - .github/workflows/quality-mutation.yml

permissions:
  contents: read

concurrency:
  group: quality-mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Mutation score (Stryker)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Stryker (fails below thresholds.break)
        run: pnpm exec stryker run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: mutation-report
          path: reports/mutation/mutation-report.json
          if-no-files-found: ignore
          retention-days: 14
