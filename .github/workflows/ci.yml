name: CI

# Tests and lint, plus the Semgrep scan the consumer apps run, over the files this package installs
# into them. The apps block CI and deploys on any finding, so a finding here must block the release.
# Around them, the other engineering gates the scorecard expects, each a job of its own: the
# coverage floors (vitest.config.js), TruffleHog, Trivy, the Syft SBOM, the lizard complexity
# gate (whitelizard.txt is its baseline) and the jscpd duplication ceiling (.jscpd.json). Mutation
# testing runs weekly in quality-mutation.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Kept in step with SEMGREP_IMAGE and the `--config` list in the apps' app-ci.yml (Kitchen-Sink).
  SEMGREP_IMAGE: "semgrep/semgrep:1.168.0"
  TRUFFLEHOG_IMAGE: "ghcr.io/trufflesecurity/trufflehog:3.99.7"

jobs:
  test:
    name: Tests and lint
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:md
      # BLOCKING: fails under the coverage floors in vitest.config.js.
      - name: Tests with coverage
        run: pnpm test --coverage

  semgrep:
    name: Semgrep (consumer SAST, blocking)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # harness/ and skills/ are what install and update copy into a repository; tests are not
      # published (package.json `files`), so they are not scanned.
      - name: Semgrep scan (blocking)
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          set -euo pipefail
          docker run --rm -v "$WORKSPACE:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --error --metrics=off --oss-only --disable-version-check \
              --config p/default --config p/security-audit --config p/secrets \
              --config p/csharp --config p/typescript --config p/react \
              --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
              --exclude '*.test.js' \
              harness skills

  secret-scan:
    name: Secret scan (TruffleHog, verified only)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: TruffleHog filesystem scan
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          docker run --rm -v "$WORKSPACE:/repo" "$TRUFFLEHOG_IMAGE" \
            filesystem /repo --only-verified --fail --no-update

  # vuln: pnpm-lock.yaml (runtime dependencies, docs/ included). misconfig:
  # the workflows. secret: the whole tree. CRITICAL/HIGH only, unfixed advisories ignored so an
  # unpatched upstream CVE cannot block every PR. Fixed versions of transitive dependencies are
  # forced through `overrides` in pnpm-workspace.yaml.
  deps-and-iac-scan:
    name: Dependencies & IaC (Trivy, blocking)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  sbom:
    name: SBOM (Syft, CycloneDX)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The action downloads the syft binary with a single non-retried GET, so a transient release
      # CDN error fails it for no code reason. The first attempt may fail; the retry below runs only
      # then, and if both fail the job fails.
      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        continue-on-error: true
        with:
          format: cyclonedx-json
          artifact-name: agent-harness-sbom.cyclonedx.json
          syft-version: v1.57.0
          upload-release-assets: false
      - name: Retry SBOM on a transient download error
        if: ${{ steps.sbom.outcome == 'failure' }}
        uses: anchore/sbom-action@fffec3d851af758d56fee099cf3fbf8aa8779843 # v0.24.3
        with:
          format: cyclonedx-json
          artifact-name: agent-harness-sbom.cyclonedx.json
          syft-version: v1.57.0
          upload-release-assets: false

  # BLOCKING. Complexity: any function in what the package ships with a cyclomatic complexity
  # above 15 fails, unless it is in whitelizard.txt, the backlog that predates the gate and only
  # shrinks. Duplication (practice 11): jscpd fails when duplicated lines exceed the ceiling in
  # .jscpd.json (`threshold`, percent), set just above the 0.21% measured when the gate was added.
  complexity-and-duplication:
    name: Complexity (lizard) and duplication (jscpd)
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Complexity gate (lizard)
        run: |
          set -euo pipefail
          pip install --disable-pip-version-check lizard==1.24.3
          lizard -l javascript -C 15 -w -W whitelizard.txt \
            -x '*.test.js' -x '*.test.mjs' -x '*/node_modules/*' \
            cli harness skills
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Duplication gate (jscpd)
        run: pnpm exec jscpd -c .jscpd.json
