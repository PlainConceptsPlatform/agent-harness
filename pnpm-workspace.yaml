packages:
  - docs
allowBuilds:
  esbuild: false
  sharp: true
minimumReleaseAgeExclude:
  - '@plainconceptsplatform/ui-theme@0.1.0'
  - '@plainconceptsplatform/ui-components@1.11.0'
# Fixed versions of transitive dependencies with HIGH advisories, which the Trivy gate in
# .github/workflows/ci.yml blocks on: image-size and postcss come with Next.js in docs/, js-yaml
# with the Markdown tooling, vite with Vitest. Drop an entry once its parent ships the fix.
overrides:
  image-size: ^2.0.3
  js-yaml@4: ^4.3.2
  postcss: ^8.5.18
  vite@8: ^8.3.3
